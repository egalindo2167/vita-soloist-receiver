name: Verify and build Vita Receiver
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows_payloads:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0, Node 24
        with:
          python-version: '3.14'
      - name: Validate tag and build Windows payloads from this source
        run: |
          python tools/source_policy.py --tracked
          python tools/release_metadata.py --check-ref "$GITHUB_REF"
          python tools/build_release_payloads.py /tmp/windows-native --source-commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0, Node 24
        with:
          name: source-built-windows-payloads
          if-no-files-found: error
          path: |
            pc/native/soloist-capture.exe
            pc/native/opus.dll
            pc/native/SHA256SUMS.txt
            pc/native_hashes.py
  windows:
    needs: windows_payloads
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        with:
          name: source-built-windows-payloads
          path: pc
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install hash-locked Windows dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r pc/requirements-windows-x64.lock
      - name: Test Python and these source-built Windows payloads
        run: python -u -W error::ResourceWarning tools/run_python_tests.py
      - name: Check native process-capture helper and Windows ABI
        run: |
          pc/native/soloist-capture.exe --version
          pc/native/soloist-capture.exe --info
  native:
    needs: windows_payloads
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: source-built-windows-payloads
          path: pc
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.14'
      - name: Install hash-locked Linux test dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r pc/requirements-linux-x64.lock
      - name: Build pinned upstream libraries and test native/TLS/protocol behavior
        run: bash tools/build_native_checks.sh /tmp/vita-native
  build:
    needs: [windows_payloads, windows, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: vitasdk/vitasdk@sha256:acd15285e1ae473e925c6f83fa41e2de45eb8b9e8ba89be7df03e194c35c11d3
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: source-built-windows-payloads
          path: pc
      - name: Build and package this commit's VPK and tested Windows payloads
        run: |
          cmake -S . -B build
          cmake --build build -j2
          python3 tools/package_release.py --release-dir /tmp/release --source-commit "$GITHUB_SHA" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: vita-audio-receiver-release
          if-no-files-found: error
          path: |
            /tmp/release/vita-audio-receiver-*.zip
            /tmp/release/vita-audio-receiver.vpk
            /tmp/release/SHA256SUMS.txt
            /tmp/release/BUILD_INFO.txt
  release_draft:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, native, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: vita-audio-receiver-release
          path: /tmp/release
      - name: Prepare draft from the exact tested tag artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/publish_release.py /tmp/release --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"
