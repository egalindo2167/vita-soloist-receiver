name: Verify and build Vita Receiver
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0, Node 24
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install hash-locked Windows dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r pc/requirements-windows-x64.lock
      - name: Test Python and the shipped Windows Opus DLL
        run: python -W error::ResourceWarning -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check native process-capture helper and Windows ABI
        run: |
          pc/native/soloist-capture.exe --version
          pc/native/soloist-capture.exe --info
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0, Node 24
        with:
          python-version: '3.14'
      - name: Install hash-locked Linux test dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r pc/requirements-linux-x64.lock
      - name: Build pinned upstream libraries and test native/TLS/protocol behavior
        run: bash tools/build_native_checks.sh /tmp/vita-native
  build:
    needs: [windows, native]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: vitasdk/vitasdk@sha256:acd15285e1ae473e925c6f83fa41e2de45eb8b9e8ba89be7df03e194c35c11d3
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3, Node 24
        with:
          persist-credentials: false
      - name: Build VPK and source package with checksums
        run: |
          cmake -S . -B build
          cmake --build build -j2
          python3 tools/package_release.py /tmp/release/vita-audio-receiver.zip
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0, Node 24
        with:
          name: vita-audio-receiver-release
          if-no-files-found: error
          path: |
            /tmp/release/vita-audio-receiver.zip
            /tmp/release/vita-audio-receiver.zip.sha256
            dist/vita-audio-receiver.vpk
            dist/SHA256SUMS.txt
