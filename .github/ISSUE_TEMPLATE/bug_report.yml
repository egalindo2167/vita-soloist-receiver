name: Bug report
description: Report a reproducible problem with setup, audio or Vita controls.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Read SUPPORT.md first. Never upload keys, pairing files, host.json, Soloist account data or recordings.
        Report vulnerabilities privately using Security → Advisories → Report a vulnerability.
  - type: input
    id: versions
    attributes:
      label: Vita app and Windows host versions
      placeholder: "Vita 1.3, host 1.3"
    validations:
      required: true
  - type: input
    id: devices
    attributes:
      label: Windows version/build and Vita model/firmware
      placeholder: "Windows 11 x64; Vita model and firmware"
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: Connection route
      options:
        - Local Wi-Fi
        - Tailscale Funnel
        - ngrok
        - Other / not connecting yet
    validations:
      required: true
  - type: input
    id: audio
    attributes:
      label: Codec and quality
      placeholder: "Opus 320, Auto Remote, PCM, or not connected"
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected result and actual result
      description: For remote failures, say whether Local works. For search, include Queue Availability's count.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant redacted log excerpt
      description: Remove secrets, personal paths and unnecessary listening/tunnel details before pasting.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I checked my text and attachments and removed credentials and private data.
          required: true
